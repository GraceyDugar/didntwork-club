<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin — didntwork.club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,800;0,9..144,900;1,9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{padding:20px}
  .admin{max-width:900px;margin:0 auto}
  .admin .formbox{max-width:none;margin-bottom:22px}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  .topbar h1{font-size:1.8rem}
  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tabs button{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800}
  .tabs button.on{background:var(--yellow)}
  .item{border-bottom:2px dashed #FFD3E0;padding:16px 0}
  .item:last-child{border-bottom:0}
  .item h3{font-size:1.15rem;margin-bottom:6px}
  .item p{margin:0 0 8px}
  .item img{max-width:260px;border-radius:12px;border:2px solid #FFD3E0;display:block;margin:6px 0 10px}
  .item .meta{border:0;padding:0;font-size:.85rem;color:var(--muted);justify-content:flex-start;gap:14px}
  .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .acts .btn{padding:7px 14px;font-size:.9rem}
  .btn.ok{background:#7BC96F}
  .badge{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--cream);border:1.5px solid var(--ink);margin-left:8px}
  #panel{display:none}
</style>
</head>
<body>
<div class="admin">
  <div class="formbox" id="gate">
    <h2>Admin</h2>
    <p class="hint">Only for the person who cries the most.</p>
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username"></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
    <div class="smallbtns" style="justify-content:flex-start"><button class="btn" id="login">Enter</button><a class="btn white" href="/">Back to site</a></div>
    <div class="status" id="gstatus"></div>
  </div>

  <div id="panel">
    <div class="topbar">
      <h1>Stories</h1>
      <div class="smallbtns"><a class="btn white" href="/" target="_blank">View site</a><button class="btn" id="logout">Log out</button></div>
    </div>
    <div class="formbox">
      <div class="tabs">
        <button class="on" data-tab="pending">Pending <span id="n-pending"></span></button>
        <button data-tab="approved">Live <span id="n-approved"></span></button>
        <button data-tab="rejected">Rejected <span id="n-rejected"></span></button>
      </div>
      <div id="list"></div>
      <div class="status" id="astatus"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
  var C = window.DW_CONFIG;
  var db = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_KEY);
  var $ = function(s){return document.querySelector(s)};
  var tab = 'pending', all = [];
  function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

  async function session(){
    var r = await db.auth.getSession();
    if (r.data.session) { $('#gate').style.display='none'; $('#panel').style.display=''; load(); }
    else { $('#gate').style.display=''; $('#panel').style.display='none'; }
  }
  $('#login').onclick = async function(){
    $('#gstatus').textContent = 'Checking…';
    var r = await db.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#pw').value });
    if (r.error) { $('#gstatus').textContent = 'Nope. ' + r.error.message; return; }
    $('#gstatus').textContent=''; session();
  };
  $('#pw').addEventListener('keydown', function(e){ if(e.key==='Enter') $('#login').click(); });
  $('#logout').onclick = async function(){ await db.auth.signOut(); session(); };

  document.querySelectorAll('.tabs button').forEach(function(b){
    b.onclick = function(){ tab = b.getAttribute('data-tab'); document.querySelectorAll('.tabs button').forEach(function(x){x.classList.toggle('on', x===b)}); draw(); };
  });

  async function load(){
    var r = await db.from('stories').select('*').order('created_at', { ascending:false });
    if (r.error) { $('#astatus').textContent = 'Could not load: ' + r.error.message; return; }
    all = r.data || []; draw();
  }
  function draw(){
    ['pending','approved','rejected'].forEach(function(k){ $('#n-'+k).textContent = '(' + all.filter(function(s){return s.status===k}).length + ')'; });
    var rows = all.filter(function(s){return s.status===tab});
    $('#list').innerHTML = rows.map(function(s){
      var who = s.anonymous || !s.name ? 'Anonymous' : s.name;
      var acts = '';
      if (tab!=='approved') acts += '<button class="btn ok" data-act="approved" data-id="'+s.id+'">Approve</button>';
      if (tab!=='rejected') acts += '<button class="btn white" data-act="rejected" data-id="'+s.id+'">Reject</button>';
      acts += '<button class="btn danger" data-act="delete" data-id="'+s.id+'">Delete</button>';
      return '<div class="item"><h3>I failed at '+esc(s.one_liner)+(s.year?'<span class="badge">RIP '+esc(s.year)+'</span>':'')+'</h3>'+
        (s.image_url?'<img src="'+esc(s.image_url)+'" alt="">':'')+
        '<p>'+esc(s.reason)+'</p>'+
        '<div class="meta"><span>'+esc(who)+'</span>'+(s.x_handle?'<span>𝕏 @'+esc(s.x_handle)+'</span>':'')+(s.linkedin?'<span>in: '+esc(s.linkedin)+'</span>':'')+'<span>'+new Date(s.created_at).toLocaleString('en-IN')+'</span></div>'+
        '<div class="acts">'+acts+'</div></div>';
    }).join('') || '<p class="hint">Nothing here.</p>';
    $('#list').querySelectorAll('[data-act]').forEach(function(b){
      b.onclick = async function(){
        var id = b.getAttribute('data-id'), act = b.getAttribute('data-act'), r;
        if (act==='delete') { if(!confirm('Delete this story for good?')) return; r = await db.from('stories').delete().eq('id', id); }
        else r = await db.from('stories').update({ status: act }).eq('id', id);
        $('#astatus').textContent = r.error ? 'Failed: ' + r.error.message : (act==='delete' ? 'Deleted.' : act==='approved' ? 'Approved — it\'s live.' : 'Rejected.');
        load();
      };
    });
  }
  session();
})();
</script>
</body>
</html>
