<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin · didntwork.club</title>
<!-- admin page v5 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=4">
<style>
  body{padding-bottom:40px}
  .adm{max-width:760px;margin:0 auto;padding:0 16px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0}
  .top h1{font-size:1.4rem;color:var(--cherry)}
  .login{max-width:420px;margin:30px auto}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px}
  .tabs button{flex:none;border:2.5px solid var(--ink);background:var(--white);border-radius:999px;padding:7px 14px;font-weight:800;font-size:.9rem;color:var(--ink)}
  .tabs button.on{background:var(--ink);color:var(--white)}
  .tabs b{font-family:var(--display);font-weight:400;margin-left:4px}
  .item{background:var(--white);border:2.5px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);padding:16px;margin:0 0 18px}
  .item h3{font-size:1.25rem;margin:4px 0 8px;line-height:1.15}
  .item p{margin:0 0 10px;white-space:pre-wrap}
  .item img{display:block;max-width:100%;max-height:320px;border-radius:10px;border:2px solid var(--ink);margin:0 0 10px}
  .info{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;font-size:.8rem}
  .info span,.info a{background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;padding:2px 9px;font-weight:700;text-decoration:none}
  .st{font-size:.75rem;font-weight:800;padding:2px 9px;border-radius:999px;border:1.5px solid var(--ink)}
  .st.pending{background:var(--mustard)}.st.approved{background:var(--teal-lt)}.st.rejected{background:var(--rose-lt)}
  .acts{display:flex;flex-wrap:wrap;gap:8px}
  .acts .btn{padding:9px 16px;font-size:.9rem}
  .btn.teal{background:var(--teal);color:var(--white)}
  .btn.ghost{background:var(--white)}
  .edit textarea,.edit input{margin-bottom:8px}
  .msg{min-height:1.4em;font-weight:700;margin:6px 0 12px}
  .none{text-align:center;padding:30px;border:3px dashed var(--ink);border-radius:18px;background:var(--blush);font-weight:600}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="adm">
  <div class="top">
    <h1>didntwork admin</h1>
    <div><a class="btn small ghost" href="/" target="_blank">View site</a> <button class="btn small" id="logout" hidden>Log out</button></div>
  </div>

  <div class="formbox login" id="loginbox">
    <h2>Log in</h2>
    <p class="hint">Only the site owner can review stories.</p>
    <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="username"></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
    <button class="btn pink" id="loginbtn">Log in</button>
    <div class="msg" id="loginmsg"></div>
  </div>

  <div id="panel" hidden>
    <div class="tabs" id="tabs">
      <button data-s="pending" class="on">Pending<b id="n-pending">0</b></button>
      <button data-s="approved">On the wall<b id="n-approved">0</b></button>
      <button data-s="rejected">Rejected<b id="n-rejected">0</b></button>
      <button id="refresh" class="btn small" style="background:var(--mustard)">Refresh</button>
    </div>
    <div class="msg" id="msg"></div>
    <div id="list"></div>
  </div>
</div>

<script>window.onerror=function(m){var b=document.getElementById('loginmsg');if(b)b.textContent='Page error: '+m;document.getElementById('loginbox').hidden=false};</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/config.js?v=4"></script>
<script>window.DW_CONFIG=window.DW_CONFIG||{SUPABASE_URL:"https://nyinemlkkbjpoajtnxnk.supabase.co",SUPABASE_KEY:"sb_publishable_Ugee72dut2LrbDDcSwuA1w_77cOx65W",UPI_ID:"graceydugar@oksbi"};</script>
<script>
(function(){
  var C=window.DW_CONFIG, db=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_KEY);
  var $=function(s){return document.querySelector(s)}, rows=[], tab='pending';
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function say(t){$('#msg').textContent=t||''}
  function when(d){try{return new Date(d).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}catch(e){return ''}}

  async function boot(){
    var s=(await db.auth.getSession()).data.session;
    $('#loginbox').hidden=!!s; $('#panel').hidden=!s; $('#logout').hidden=!s;
    if(s) load();
  }

  $('#loginbtn').onclick=async function(){
    $('#loginmsg').textContent='Logging in…';
    var r=await db.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
    $('#loginmsg').textContent=r.error?('Login failed: '+r.error.message):'';
    boot();
  };
  $('#pw').addEventListener('keydown',function(e){if(e.key==='Enter')$('#loginbtn').click()});
  $('#logout').onclick=async function(){await db.auth.signOut();boot()};

  async function load(){
    say('Loading…');
    var r=await db.from('stories').select('*').order('created_at',{ascending:false});
    if(r.error){say('Could not load stories: '+r.error.message);return}
    rows=r.data||[];
    if(!rows.length){say('No stories found. If people have submitted, the admin policies in Supabase are missing or use a different email.')}else say('');
    render();
  }

  function render(){
    ['pending','approved','rejected'].forEach(function(s){
      $('#n-'+s).textContent=rows.filter(function(r){return (r.status||'pending')===s}).length;
    });
    document.querySelectorAll('#tabs [data-s]').forEach(function(b){b.classList.toggle('on',b.dataset.s===tab)});
    var list=rows.filter(function(r){return (r.status||'pending')===tab});
    if(!list.length){$('#list').innerHTML='<div class="none">Nothing '+(tab==='approved'?'on the wall':tab)+' right now.</div>';return}
    $('#list').innerHTML=list.map(function(r){
      var who=r.anonymous||!r.name?'Anonymous':r.name, st=r.status||'pending', b='';
      if(st!=='approved') b+='<button class="btn teal" data-a="approved" data-id="'+r.id+'">Approve</button>';
      if(st==='approved') b+='<button class="btn ghost" data-a="pending" data-id="'+r.id+'">Take off wall</button>';
      if(st!=='rejected') b+='<button class="btn ghost" data-a="rejected" data-id="'+r.id+'">Reject</button>';
      b+='<button class="btn ghost" data-a="edit" data-id="'+r.id+'">Edit</button>';
      if(st==='rejected') b+='<button class="btn pink" data-a="delete" data-id="'+r.id+'">Delete forever</button>';
      return '<div class="item" id="it-'+r.id+'">'+
        '<span class="st '+st+'">'+st+'</span>'+
        '<h3>'+esc(r.one_liner)+'</h3>'+
        (r.image_url?'<a href="'+esc(r.image_url)+'" target="_blank" rel="noopener"><img src="'+esc(r.image_url)+'" alt="Screenshot"></a>':'')+
        '<p>'+esc(r.reason)+'</p>'+
        '<div class="info"><span>'+esc(who)+'</span>'+(r.year?'<span>RIP '+esc(r.year)+'</span>':'')+
        (r.x_handle?'<a href="https://x.com/'+esc(String(r.x_handle).replace(/^@/,''))+'" target="_blank" rel="noopener">𝕏 @'+esc(String(r.x_handle).replace(/^@/,''))+'</a>':'')+
        (r.linkedin?'<a href="'+esc(/^https?:/.test(r.linkedin)?r.linkedin:'https://'+r.linkedin)+'" target="_blank" rel="noopener">LinkedIn</a>':'')+
        '<span>'+when(r.created_at)+'</span></div>'+
        '<div class="edit" hidden><input value="'+esc(r.one_liner)+'" maxlength="90"><textarea maxlength="300">'+esc(r.reason)+'</textarea>'+
        '<div class="acts"><button class="btn teal" data-a="save" data-id="'+r.id+'">Save changes</button><button class="btn ghost" data-a="cancel" data-id="'+r.id+'">Cancel</button></div></div>'+
        '<div class="acts main">'+b+'</div></div>';
    }).join('');
  }

  $('#tabs').onclick=function(e){
    var b=e.target.closest('button'); if(!b)return;
    if(b.id==='refresh'){load();return}
    tab=b.dataset.s; render();
  };

  $('#list').onclick=async function(e){
    var b=e.target.closest('button[data-a]'); if(!b)return;
    var id=b.dataset.id, a=b.dataset.a, box=document.getElementById('it-'+id);
    if(a==='edit'||a==='cancel'){box.querySelector('.edit').hidden=a==='cancel';box.querySelector('.main').hidden=a==='edit';return}
    var r;
    b.disabled=true;
    if(a==='save'){
      r=await db.from('stories').update({one_liner:box.querySelector('.edit input').value.trim(),reason:box.querySelector('.edit textarea').value.trim()}).eq('id',id).select();
    }else if(a==='delete'){
      if(!confirm('Delete this story forever?')){b.disabled=false;return}
      r=await db.from('stories').delete().eq('id',id).select();
    }else{
      r=await db.from('stories').update({status:a}).eq('id',id).select();
    }
    if(r.error){say('That didn\'t save: '+r.error.message);b.disabled=false;return}
    if(!r.data||!r.data.length){say('Nothing changed. Check the admin policies in Supabase (step 2 of setup).');b.disabled=false;return}
    var done=a==='approved'?'Approved. It\'s on the wall now.':a==='rejected'?'Rejected.':a==='pending'?'Taken off the wall.':a==='delete'?'Deleted.':'Saved.';
    await load(); say(done);
  };

  boot().catch(function(e){$('#loginbox').hidden=false;$('#loginmsg').textContent='Setup error: '+(e.message||e)});
})();
</script>
</body>
</html>
